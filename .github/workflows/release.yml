name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential make libreadline-dev
      - name: Build and tests
        run: make && make check
      - name: Create tarball
        run: tar -czf mysh-${GITHUB_REF_NAME}.tar.gz .
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mysh-${{ github.ref_name }}.tar.gz
